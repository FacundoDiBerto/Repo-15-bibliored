<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="./css/estilos.css">
</head>
<body>
  <header>
    <main>
      <label for="Control-suscripcion" class="boton-sus">Suscribirse</label>
      <input type="checkbox" id="Control-suscripcion" class="modal-Sus">
      <div class="Ventana-suscripcion">
      <div class="tarjeta-suscripcion">
        <label for="Control-suscripcion" class="boton-cerrar-sus"></label>
        <h3>Suscribirse</h3>
       <form>
       <label for="">Nombre de Usuario</label>
       <input type="text" required minlength="5" max="10">
      
       <label for="">Email de Usuario</label>
       <input type="email" required/>
      
       <label for="">Contraseña</label>
       <input type="text"/>
      
       <button type="submit">Enviar Datos</button>
       <button type="reset">Limpiar Formulario</button>
      </form>
      </div>
      </div>
    </div>
    </main>
  </header>
</body>
</html>
