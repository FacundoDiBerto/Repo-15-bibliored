<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BiblioRed</title>
    <meta
      name="description"
      content="BiblioRed es un blog sobre manga, cómics, novelas gráficas y literatura fantástica, con reseñas, novedades y recomendaciones de lectura."
    />
    <meta
      name="keywords"
      content="BiblioRed, manga, cómics, novelas gráficas, literatura fantástica, reseñas, novedades, recomendaciones de lectura"
    />
    <meta
      name="author"
      content="Facundo Di Berto, Samir Morhill, Nicolás Nanni, Leiza Gamalero y Paula Omonte"
    />
    <link rel="icon" href="assets/img/favicon.png" type="image/x-icon" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="../css/estilos.css" />
  </head>
  <body>
    <header class="sticky-top">
      <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <a class="navbar-brand tamanio" href="../index.html"
            ><img
              class="w-100"
              src="../assets/img/logo-bibliored.png"
              alt="Logo de BiblioRed"
          /></a>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a
                  class="nav-link nav-botones"
                  aria-current="page"
                  href="../index.html"
                  >Inicio</a
                >
              </li>
              <li class="nav-item espacio-items">
                <a class="nav-link nav-botones" href="galeria-img.html"
                  >Galería</a
                >
              </li>
              <li class="nav-item espacio-items">
                <a class="nav-link nav-botones" href="sobre-nosotros.html"
                  >Acerca de nosotros</a
                >
              </li>
              <li class="nav-item espacio-items">
                <a class="nav-link nav-botones" href="contacto.html"
                  >Contacto</a
                >
              </li>
            </ul>
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
              <li class="nav-item espacio-items">
                <a class="nav-link nav-botones activo" href="login.html"
                  >Iniciar Sesión</a
                >
              </li>
              <li class="nav-item espacio-items">
                <a class="nav-link nav-suscribirse" href="#">Suscribirse</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>
    <main>
      <div class="container-fluid min-vh-100">
        <div class="row h-100">
          <div
            class="col-md-6 d-flex align-items-center justify-content-center"
          >
            <div class="card ">
              <div class="card-body ">
                <h5 class="card-title fw-bold text-center">Iniciar Sesión</h5>
                <p class="card-text">
                  Ingresa con tu usuario y contraseña para acceder a tu cuenta.
                </p>
                <form>
                  <div class="mb-3">
                    <label for="username" class="form-label fw-bold"
                      >Correo o Usuario de administrador</label
                    >
                    <span class="badge text-bg-danger mb-2">REQUERIDO</span>
                    <input
                      type="text"
                      class="form-control"
                      id="username"
                      placeholder="Ingresa tu usuario"
                      required
                    />
                  </div>
                  <div class="mb-3">
                    <label for="password" class="form-label fw-bold"
                      >Contraseña</label
                    >
                    <input
                      type="password"
                      class="form-control"
                      id="password"
                      placeholder="Ingresa tu contraseña"
                      required
                    />
                  </div>
                </form>

                <div class="form-check mb-3">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="showPasswordCheck"
                  />
                  <div class="container d-flex justify-content-between">
                    <label class="form-check-label" for="showPasswordCheck">
                      Mostrar contraseña
                    </label>
                    <label class="form-check-label">
                      <a href="#" class="text-decoration-none"
                        ></a>¿Olvidaste tu contraseña?</a> <!-- Incluir el link al modal -->
                    </label>
                  </div>
                </div>
                <button type="submit" class="btn-iniciar-sesion w-100">
                  Iniciar Sesión
                </button>
              </div>
              <div class= "container d-flex justify-content-center gap-3 mb-3"> 
                  <button type="button" class="btn btn-primary btn-lg">Google</button>
                  <button  type="button" class="btn btn-secondary btn-lg"><i type="button" class="bi bi-facebook text-center git status">Facebook</i></button>
                  
              </div>
            </div>
          </div>

          <div class="col-md-6 d-none d-md-block p-0">
            <img
              src="../assets/img/imagen-login.jpg"
              class="w-100 h-100"
              style="object-fit: cover"
            />
          </div>
        </div>
      </div>
    </main>

    <footer>
      <div class="container text-center">
        <div class="row">
          <div class="col-lg-4 col-md-6 col-sm-12">Column</div>
          <div class="col-lg-4 col-md-6 col-sm-12">Column</div>
          <div class="col-lg-4 col-md-6 col-sm-12">Column</div>
        </div>
      </div>
      </footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
