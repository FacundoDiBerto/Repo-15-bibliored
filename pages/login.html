<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BiblioRed</title>
    <meta
      name="description"
      content="BiblioRed es un blog sobre manga, cómics, novelas gráficas y literatura fantástica, con reseñas, novedades y recomendaciones de lectura."
    />
    <meta
      name="keywords"
      content="BiblioRed, manga, cómics, novelas gráficas, literatura fantástica, reseñas, novedades, recomendaciones de lectura"
    />
    <meta
      name="author"
      content="Facundo Di Berto, Samir Morhill, Nicolás Nanni, Leiza Gamalero y Paula Omonte"
    />
    <link rel="icon" href="../assets/img/favicon.png" type="image/x-icon" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="../css/estilos.css" />
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">Navbar</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="#">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Link</a>
              </li>
              <li class="nav-item dropdown">
                <a
                  class="nav-link dropdown-toggle"
                  href="#"
                  role="button"
                  data-bs-toggle="dropdown"
                  aria-expanded="false"
                >
                  Dropdown
                </a>
                <ul class="dropdown-menu">
                  <li><a class="dropdown-item" href="#">Action</a></li>
                  <li><a class="dropdown-item" href="#">Another action</a></li>
                  <li><hr class="dropdown-divider" /></li>
                  <li>
                    <a class="dropdown-item" href="#">Something else here</a>
                  </li>
                </ul>
              </li>
              <li class="nav-item">
                <a class="nav-link disabled" aria-disabled="true">Disabled</a>
              </li>
            </ul>
            <form class="d-flex" role="search">
              <input
                class="form-control me-2"
                type="search"
                placeholder="Search"
                aria-label="Search"
              />
              <button class="btn btn-outline-success" type="submit">
                Search
              </button>
            </form>
          </div>
        </div>
      </nav>
    </header>
    <main>
      <div class="container-fluid min-vh-100">
        <div class="row h-100">
          <div
            class="col-md-6 d-flex align-items-center justify-content-center"
          >
            <div class="card">
              <div class="card-body">
                <h5 class="card-title">Iniciar Sesión</h5>
                <p class="card-text">
                  Ingresa con tu usuario y contraseña para acceder a tu cuenta.
                </p>
                <form>
                  <div class="mb-3">
                    <label for="username" class="form-label">Correo o Usuario de administrador</label>
                    <span class="badge text-bg-danger mb-2">REQUERIDO</span>
                    <input
                      type="text"
                      class="form-control"
                      id="username"
                      placeholder="Ingresa tu usuario"
                      required
                    />
                  </div>
                  <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input
                      type="password"
                      class="form-control"
                      id="password"
                      placeholder="Ingresa tu contraseña"
                      required
                    />
                  </div>
                  <div class="form-check mb-3">
  <input class="form-check-input" type="checkbox" id="showPasswordCheck">
  <label class="form-check-label" for="showPasswordCheck">
    Mostrar contraseña
  </label>
</div>
                  <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
              </div>
            </div>
          </div>

          <!-- Columna derecha: imagen -->
          <div class="col-md-6 d-none d-md-block p-0">
            <img
              src="../assets/img/imagen-login.jpg"
              class="w-100 h-100"
              style="object-fit: cover"
            />
          </div>
        </div>
      </div>
    </main>
    <footer></footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
