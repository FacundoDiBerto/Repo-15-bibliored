        </div>

    </header>
    <main></main>
    <footer>
      <div class="container text-center">
        <div class="row">
          <div class="col-lg-4 col-md-6 col-sm-12">Column</div>
          <div class="col-lg-4 col-md-6 col-sm-12">Column</div>
          <div class="col-lg-4 col-md-6 col-sm-12">Column</div>
        </div>
      </div>
    </footer>
    <div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header border-0">
        <h1 class="modal-title fs-5" id="staticBackdropLabel FW-bold">Suscripción a Novedades</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="text-justify p-3">
      Recibe notificaciones inemediatas sobre nuevos tomos, mangas limitados y reseñas
      </div>
      <div class="modal-body">
      
      <div class="mb-3">
        <label for="nombre" class="form-label FW-bold">Nombre Completo</label>
        <input type="text" class="form-control" id="nombre" placeholder="Tu nombre o alias de lector">
      </div>
      <div class="mb-3">
        <label for="email" class="form-label" FW-bold>Correo electrónico</label>
        <input type="email" class="form-control" id="email" placeholder="ejemplo@correo.com">
      </div>
      <div class="mb-3" >
        <label for="categoria" class="form-label" FW-bold>Categoría preferida</label>
        <select class="form-control" id="categoria">
          <option value="" disabled selected hidden>Manga, Libro, Revista</option>
          <option value="1">Manga</option>
          <option value="2">Libro</option>
          <option value="3">Revista</option>
        </select>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn-primary fw-bold">Confirmar Suscripción</button>
      </div>
    </div>
  </div>
</div>
